<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Simpler and Better</title>
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Simpler and Better">
  <meta property="og:description" content="Fewer moving parts. Better outcomes.">
  <meta property="og:url" content="https://simplerandbetter.com">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/bimi-logo.svg">
  <link rel="preload" href="/assets/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* Space Grotesk by Florian Karsten — SIL Open Font License 1.1.
       Self-hosted: no third-party requests, no visitor data leaves this domain. */
    @font-face {
      font-family: 'Space Grotesk'; font-style: normal; font-weight: 300 700; font-display: swap;
      src: url('/assets/fonts/space-grotesk-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Space Grotesk'; font-style: normal; font-weight: 300 700; font-display: swap;
      src: url('/assets/fonts/space-grotesk-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Space Grotesk'; font-style: normal; font-weight: 300 700; font-display: swap;
      src: url('/assets/fonts/space-grotesk-vietnamese.woff2') format('woff2');
      unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
    }

    :root {
      --bg: #0b0e14;
      --bg-soft: #11151f;
      --ink: #e8ecf4;
      --ink-dim: #8b93a7;
      --accent: #ffb454;
      --accent-2: #ff7a59;
      --line: rgba(232, 236, 244, 0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6; overflow-x: hidden;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0 1.5rem; }

    header { display: flex; align-items: center; justify-content: space-between; padding: 1.5rem 0; }
    .logo {
      display: flex; align-items: center; gap: 0.6rem;
      font-weight: 700; font-size: 1.15rem; letter-spacing: 0.02em; color: var(--ink);
    }
    .logo:hover { text-decoration: none; }
    .logo svg { width: 1.5rem; height: 1.5rem; flex: none; }
    .logo .and { color: var(--ink-dim); font-weight: 300; }
    nav a { color: var(--ink-dim); margin-left: 1.5rem; font-size: 0.95rem; }
    nav a:hover { color: var(--ink); text-decoration: none; }

    .hero { position: relative; padding: 7rem 0 6rem; text-align: center; }
    .hero::before {
      content: ""; position: absolute; inset: -8rem -20rem 0;
      background:
        radial-gradient(600px 300px at 50% 0%, rgba(255, 180, 84, 0.12), transparent 70%),
        radial-gradient(500px 260px at 70% 20%, rgba(255, 122, 89, 0.10), transparent 70%);
      pointer-events: none;
    }
    .bars-bg {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -56%);
      width: min(620px, 92vw); opacity: 0.4; pointer-events: none;
    }
    .bars-bg rect { fill: none; stroke: var(--line); stroke-width: 1; }
    .bars-bg .drift { animation: drift 14s ease-in-out infinite; }
    .bars-bg .d2 { animation-delay: -4.6s; }
    .bars-bg .d3 { animation-delay: -9.2s; }
    @keyframes drift {
      0%, 100% { transform: translateX(-10px); }
      50%      { transform: translateX(10px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bars-bg .drift { animation: none; }
      html { scroll-behavior: auto; }
    }

    .hero h1 {
      position: relative;
      font-size: clamp(2.4rem, 8.5vw, 5.2rem);
      font-weight: 700; letter-spacing: -0.03em; line-height: 1.05;
    }
    .hero h1 .amp { color: var(--ink-dim); font-weight: 300; }
    .hero h1 .better {
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    .hero p.tag {
      position: relative; margin: 1.5rem auto 0; max-width: 34rem;
      font-size: clamp(1.05rem, 2.5vw, 1.3rem); color: var(--ink-dim);
    }
    .hero .cta {
      position: relative; display: inline-block; margin-top: 2.5rem;
      padding: 0.85rem 2rem; border-radius: 999px;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      color: #2a1405; font-weight: 700; font-size: 1rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .hero .cta:hover {
      text-decoration: none; transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(255, 180, 84, 0.25);
    }

    .principles { padding: 4rem 0 5rem; border-top: 1px solid var(--line); }
    .principles h2 {
      text-align: center; font-size: 1.1rem; font-weight: 500; color: var(--ink-dim);
      letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 2.5rem;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem; }
    .card {
      background: var(--bg-soft); border: 1px solid var(--line);
      border-radius: 14px; padding: 1.5rem;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card:hover { transform: translateY(-3px); border-color: rgba(255, 180, 84, 0.35); }
    .card h3 { font-size: 1.05rem; margin-bottom: 0.4rem; }
    .card p { color: var(--ink-dim); font-size: 0.95rem; }
    .card .n {
      display: block; font-size: 0.8rem; letter-spacing: 0.18em;
      color: var(--accent); margin-bottom: 0.7rem;
    }

    .contact { padding: 4rem 0 5rem; border-top: 1px solid var(--line); text-align: center; }
    .contact h2 { font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: -0.02em; }
    .contact p { color: var(--ink-dim); margin-top: 0.75rem; }
    .contact .mail {
      display: inline-block; margin-top: 1.5rem;
      font-size: clamp(1rem, 3vw, 1.35rem); font-weight: 500;
      border-bottom: 1px solid rgba(255, 180, 84, 0.4); padding-bottom: 2px;
      word-break: break-word;
    }
    .contact .mail:hover { text-decoration: none; border-bottom-color: var(--accent); }

    footer {
      border-top: 1px solid var(--line); padding: 2rem 0 3rem;
      color: var(--ink-dim); font-size: 0.9rem;
      display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem;
      align-items: center; justify-content: space-between;
    }
    footer a { color: var(--ink-dim); }
    footer a:hover { color: var(--ink); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="logo" href="/">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <g fill="#ffb454">
            <rect x="12" y="28" width="76" height="11" rx="5.5"/>
            <rect x="25" y="45" width="50" height="11" rx="5.5"/>
            <rect x="38" y="62" width="24" height="11" rx="5.5"/>
          </g>
        </svg>
        <span>simpler <span class="and">and</span> better</span>
      </a>
      <nav><a href="/">Home</a></nav>
    </header>

    <section class="hero">
      <svg class="bars-bg" viewBox="0 0 400 300" aria-hidden="true">
        <rect class="drift"    x="40"  y="70"  width="320" height="42" rx="21"/>
        <rect class="drift d2" x="90"  y="132" width="220" height="42" rx="21"/>
        <rect class="drift d3" x="140" y="194" width="120" height="42" rx="21"/>
      </svg>
      <h1><span class="better">404</span></h1>
      <p class="tag">We simplified that page right out of existence.</p>
      <a class="cta" href="/">Back to the start</a>
    </section>

    <footer>
      <span>&copy; 2026 Simpler and Better</span>
      <span><a href="/.well-known/security.txt">security.txt</a></span>
    </footer>
  </div>

  <!-- Hidden tracking pixel -->
  <img src="https://track.simplerandbetter.com/assets/pixel.png?p=404" style="display:none;" alt="" aria-hidden="true">
</body>
</html>
